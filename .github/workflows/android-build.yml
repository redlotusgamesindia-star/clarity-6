# =============================================================================
# Clarity — Android CI
# =============================================================================
# Tests the domain logic, then assembles debug + release APKs AND a release
# AAB (App Bundle — the format Play Console requires for new apps), and
# uploads all of them as workflow artifacts. Release signing is optional:
# with no secrets configured the workflow still succeeds and uploads the
# UNSIGNED release APK/AAB; add the four secrets below and it signs +
# verifies both automatically.
#
# Required signing secrets:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# =============================================================================

name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.10.2"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    name: Test & assemble APKs + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # --------------------------------------------------------------- checkout

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------- Java

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ----------------------------------------------------------- Android SDK

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      # ---------------------------------------------------------------- Gradle

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

      # -------------------------------------------------------- quality gate

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      # -------------------------------------------------------------- builds

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace

      - name: List APK outputs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Assemble release AAB
        run: gradle bundleRelease --stacktrace

      - name: List AAB outputs
        run: find app/build/outputs/bundle -name "*.aab" -exec ls -lh {} \;

      # ------------------------------------------------------------- signing

      - name: Sign release APK
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          APK_DIR="app/build/outputs/apk/release"
          KEYSTORE="$RUNNER_TEMP/release.keystore"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          "$BT/zipalign" -f -p 4 \
            "$APK_DIR/app-release-unsigned.apk" \
            "$APK_DIR/app-release-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK_DIR/clarity-release-signed.apk" \
            "$APK_DIR/app-release-aligned.apk"

          "$BT/apksigner" verify \
            --print-certs \
            "$APK_DIR/clarity-release-signed.apk"

          rm -f "$KEYSTORE" "$APK_DIR/app-release-aligned.apk"

      - name: Sign release AAB
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          AAB_DIR="app/build/outputs/bundle/release"
          KEYSTORE="$RUNNER_TEMP/release.keystore"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "$AAB_DIR/clarity-release-signed.aab" \
            "$AAB_DIR/app-release.aab" \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify "$AAB_DIR/clarity-release-signed.aab"

          rm -f "$KEYSTORE"

      # ----------------------------------------------------------- artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clarity-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK (signed)
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: clarity-release-signed-${{ github.run_number }}
          path: app/build/outputs/apk/release/clarity-release-signed.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        if: ${{ env.SIGNING_ENABLED != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: clarity-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release AAB (signed)
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: clarity-release-signed-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/clarity-release-signed.aab
          retention-days: 14
          if-no-files-found: error

      - name: Upload release AAB (unsigned)
        if: ${{ env.SIGNING_ENABLED != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: clarity-release-unsigned-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
